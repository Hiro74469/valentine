<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#ffd6e0;font-family:Arial;text-align:center}
button{padding:15px 30px;font-size:18px;border:none;border-radius:12px;margin:10px;transition:.3s}
#yes{background:#ff4d6d;color:#fff}
#no{background:#ccc}
</style>
</head>
<body>
<div>
<h1 style="color:#ff4d6d">Will you be my Valentine babbi? 💘</h1>
<button id="yes">YES</button>
<button id="no">NO</button>
</div>

<script>
let s=1,c=0;
const t=["Are you sure?","Babbi u sure?","BABBBIIIU 😭","E YES NALANG GYUD NA BABBI 🥺","BABBBII pleaseeee 💔"];
no.onclick=()=>{s+=.3;yes.style.transform=`scale(${s})`;no.innerText=t[c]||"YES NALANG BABBI 😭";c++};
yes.onclick=()=>{document.body.innerHTML='<h1 style=color:#ff4d6d>I love u sm babbi 💕</h1>'};
</script>
</body>
</html>
